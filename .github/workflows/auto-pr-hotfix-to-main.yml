name: Auto PR hotfix to main

on:
  push:
    branches:
      - 'hotfix/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/ci-validate.yml

  open-or-update-pr:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request hotfix -> main
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';

            if (!/^hotfix\//.test(head)) {
              core.info(`Branch ${head} ignored: not a hotfix branch.`);
              return;
            }

            const summary = head.replace(/^hotfix\//, '').replace(/[-_]+/g, ' ').trim() || head;
            const title = `[hotfix] ${summary}`;

            const body = [
              '## PR de hotfix criada automaticamente',
              '',
              `Branch de origem: \`${head}\``,
              'Branch de destino: `main`',
              '',
              '### Requisitos obrigatorios antes do merge',
              '- [ ] CI de validacao passou (lint, type-check e formatacao).',
              '- [ ] Owner revisou o hotfix.',
              '- [ ] PR aprovada antes do merge.',
              '',
              '_Este PR foi aberto automaticamente pelo workflow._'
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            let prNumber;

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              prNumber = pr.number;
              core.info(`Updated existing PR #${prNumber}.`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title,
                body,
                draft: false,
              });
              prNumber = created.data.number;
              core.info(`Created PR #${prNumber}.`);
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: [owner],
              });
              core.info(`Requested review from ${owner}.`);
            } catch (error) {
              core.warning(`Could not request reviewer automatically: ${error.message}`);
            }
