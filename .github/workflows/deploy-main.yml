name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Compilar APK do Android?'
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Validar qualidade (tipos, lint, formatação)
        run: npm run validate

  deploy:
    needs: validate
    runs-on: [self-hosted, frontend]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar deploy na VPS
        shell: bash
        env:
          BUILD_APK: ${{ (contains(github.event.head_commit.message, '[skip-apk]') || contains(github.event.head_commit.message, '[skip apk]')) && 'false' || (inputs.build_apk != '' && inputs.build_apk || 'true') }}
        run: /home/dev/scripts/deploy-frontend.sh
