name: Auto PR to develop

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request to develop
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'develop';

            const validPrefix = /^(feature|fix|refactor|chore|docs)\//;
            if (!validPrefix.test(head)) {
              core.info(`Branch ${head} ignored: does not match configured prefixes.`);
              return;
            }

            const [type, ...nameParts] = head.split('/');
            const summaryRaw = nameParts.join('/').replace(/[-_]+/g, ' ').trim();
            const summary = summaryRaw ? summaryRaw : head;
            const title = `[${type}] ${summary}`;

            const body = [
              '## PR criada automaticamente',
              '',
              `Branch de origem: \`${head}\``,
              'Branch de destino: `develop`',
              '',
              '### Resumo',
              '- Descreva o objetivo da mudança.',
              '- Liste os principais arquivos/fluxos impactados.',
              '',
              '### Checklist',
              '- [ ] Rodei `npm run validate` localmente.',
              '- [ ] CI de validacao passou (lint, type-check e formatacao).',
              '- [ ] Testei o fluxo principal e os cenarios de erro.',
              '- [ ] Atualizei a documentacao quando necessario.',
              '',
              '_Este PR foi aberto automaticamente pelo workflow._'
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.info(`Updated existing PR #${pr.number}.`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body,
              draft: false,
            });

            core.info(`Created PR #${created.data.number}.`);
