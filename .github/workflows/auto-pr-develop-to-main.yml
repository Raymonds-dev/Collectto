name: Auto PR develop to main

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update pull request develop -> main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'develop';
            const base = 'main';

            const title = '[release] develop -> main';
            const body = [
              '## PR de release criada automaticamente',
              '',
              'Branch de origem: `develop`',
              'Branch de destino: `main`',
              '',
              '### Revisao obrigatoria',
              '- [ ] Revisar impacto geral da release',
              '- [ ] Validar alteracoes criticas de navegacao/autenticacao',
              '- [ ] Aprovar PR antes do merge',
              '',
              '_Este PR foi aberto automaticamente pelo workflow._'
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            let prNumber;

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              prNumber = pr.number;
              core.info(`Updated existing PR #${prNumber}.`);
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head,
                base,
                title,
                body,
                draft: false,
              });
              prNumber = created.data.number;
              core.info(`Created PR #${prNumber}.`);
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number: prNumber,
                reviewers: [owner],
              });
              core.info(`Requested review from ${owner}.`);
            } catch (error) {
              core.warning(`Could not request reviewer automatically: ${error.message}`);
            }
